# IRIS site parameters (HugoBlox schema v2)
hugoblox:
  schema: "2.0"

  appearance:
    mode: light
    color_theme: rsidea
    font: default

  identity:
    # Shown in navbar/footer and SEO meta
    name: "IRIS"
    organization: "智能遥感信息工程与应用课题组"
    type: organization
    tagline: "Intelligent Remote-sensing Information Systems & Applications"
    description: "IRIS focuses on computer vision and multi-source remote sensing, building intelligent perception, analysis, and application systems—from Earth observation to eye-inspired perception."

    social:
      # Fill as needed
      # github: "IRIS-RS-Lab"
      # email: "contact@iris-lab.org"
      twitter: ""

  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: false
    theme_picker: false
    language_switcher: true
    cta:
      enable: false
      text: ""
      url: ""

  footer:
    style: minimal
    language_switcher: true
    text: ""

  copyright:
    notice: "© {year} {name}."

  content:
    math:
      enable: true
    toc:
      enable: true
    reading_time:
      enable: true
    citations:
      style: ieee

  search:
    enable: true
    suggestions: ["remote sensing", "computer vision", "change detection", "SAR", "segmentation"]

# HugoBlox reads marketing at the TOP LEVEL (not under hugoblox).
# Empty IDs disable integrations. These are public identifiers, never passwords.
marketing:
  analytics:
    google_analytics: "G-7ZNESBWCZ0" # GA4 web stream measurement ID, e.g. G-XXXXXXXXXX
  verification:
    google: "" # Search Console HTML meta tag content only
    bing: ""   # Bing Webmaster Tools msvalidate.01 content only
    baidu: ""  # Baidu Search Resource Platform meta tag content only
