name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt -r requirements-translation.txt

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 【绝对禁止修改此版本号】HugoBlox v5 强依赖 0.128.2
          hugo-version: '0.128.2'
          extended: true

      - name: Sync publication data from publications.bib
        run: python scripts/sync_pubs.py --skip-bundles

      - name: Test content synchronization
        run: python -m unittest discover -s tests -v

      - name: Restore English translations
        id: translation_cache
        uses: actions/cache/restore@v4
        with:
          path: data/translations/en.json
          key: english-v1-${{ hashFiles('scripts/sync_en.py', 'data/translations/en.json') }}-${{ hashFiles('content/zh/**/*.md', 'data/projects/zh.yaml', 'publications.bib', 'config/_default/menus.zh.yaml') }}
          restore-keys: |
            english-v1-${{ hashFiles('scripts/sync_en.py', 'data/translations/en.json') }}-

      - name: Sync English website
        id: english_sync
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TRANSLATION_MODEL: ${{ vars.OPENAI_TRANSLATION_MODEL || 'gpt-4.1-mini' }}
        run: python scripts/sync_en.py --translate

      - name: Save completed English translations
        if: steps.english_sync.outcome == 'success' && steps.translation_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/translations/en.json
          key: ${{ steps.translation_cache.outputs.cache-primary-key }}

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify --baseURL "https://iris-rs-lab.github.io/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
