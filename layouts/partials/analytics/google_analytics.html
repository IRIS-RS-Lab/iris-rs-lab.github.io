{{/* The theme invokes this once per page. Never load Google before consent. */}}
{{- $id := partial "analytics/measurement-id" . -}}
{{- if and hugo.IsProduction $id -}}
  {{- $script := resources.Get "js/iris-analytics.js" | minify | fingerprint -}}
  <script id="iris-analytics" defer src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" data-measurement-id="{{ $id }}"></script>
{{- end -}}
